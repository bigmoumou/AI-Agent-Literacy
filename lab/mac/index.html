<script>
  // 課程網址：舊的 github.io 和 learning-analytics-tools.pages.dev（2026-10-21 改名前）都轉到 ai-agent-literacy.pages.dev 的同一頁，保留 #t= 等片段
  if (location.hostname.endsWith("github.io") || /(^|\.)learning-analytics-tools\.pages\.dev$/.test(location.hostname)) {
    location.replace("https://ai-agent-literacy.pages.dev" + (location.pathname.replace(/^\/(Learning-Analytics-Tools|AI-Agent-Literacy)(?=\/|$)/, "") || "/") + location.search + location.hash);
  }
</script>
<script>
  // 進入前的「連線到遠端電腦」畫面（js/connect.js）：?connect=0 或測試時跳過；在任何東西畫出來之前就決定，畫面才不會先閃一下
  (function () {
    var q = location.search, skip = /[?&](connect|welcome)=0(&|$)/.test(q);
    document.documentElement.className += skip ? " lab-noconnect" : " lab-connecting";
    // 液態玻璃的折射（SVG 位移濾鏡套在 backdrop-filter 上）只有 Chromium 系瀏覽器（Chrome、Edge）畫得出來；其他瀏覽器用較強的模糊
    try {
      var ua = navigator.userAgentData;
      if (ua && ua.brands && ua.brands.some(function (b) { return /Chromium/.test(b.brand); })) document.documentElement.className += " lab-lg";
    } catch (e) { /* ignore */ }
  })();
</script>

<script>
  // English (製作/english/lab-en): an English browser, or ?lang=en, gets index.en.html with the same address parameters, for the weeks that have an English version
  // (LAB_EN_WEEKS). Not when this page sits inside another page (the Week 6 exam embeds the Chinese computer). Chinese and every other language: nothing happens here.
  (function () {
    var LAB_EN_WEEKS = [3, 4, 5, 7, 8];
    if (!(window.I18N && I18N.lang === "en" && window === window.top)) return;
    var q = location.search, m = /[?&]week=(\d+)(?:&|$)/.exec(q) || /[?&]mission=w(\d+)-/.exec(q), wk = m ? +m[1] : 3;
    if ([3, 4, 5, 7, 8].indexOf(wk) < 0) wk = 3;
    if (LAB_EN_WEEKS.indexOf(wk) < 0) return;
    document.documentElement.style.visibility = "hidden";
    location.replace("index.en.html" + location.search + location.hash);
  })();
</script>

<svg class="lab-svgdefs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">

    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="90" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="lab-lg-calm" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="1" seed="5" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="3" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
