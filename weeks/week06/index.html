<!-- Week 6 只有考試，一進來就直接掉進去（流程和計時在 exam.js）：
     1. 首頁膠捲那一格的圖（老師的概念圖，assets/exam-art.js）蓋滿螢幕，沿著裂縫撕開，裂縫裡長出黑洞，
        裂痕爬滿、碎成玻璃片無重力漂浮，再被吸回中心扭成光環；鏡頭衝向黑洞（時間膨脹、重力紅移、重力波、畫面撕裂），
        越過事件視界全黑。黑洞是 WebGL 逐像素光線追蹤（assets/blackhole.js，畫在 #bh），撕開的那張圖在 #rift，
        裂痕和碎片是 2D（assets/rift.js）。
     2. 深空裡選一台電腦（Mac／Windows），連線（#rift）。
     3. 遠端桌面從兩邊合上來把裂縫封起來，就進到遠端電腦（iframe，lab/mac 或 lab/win）。
     沒有 WebGL2 時用 2D 版；系統設定「減少動態效果」時直接到選電腦。 -->
<body class="exam is-diving is-loading" data-root="../../">
<canvas id="bh" aria-hidden="true" style="display:none"></canvas>
<canvas id="rift" aria-hidden="true"></canvas>
<iframe id="remote" title="遠端電腦" hidden allow="fullscreen"></iframe>
